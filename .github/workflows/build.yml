name: build-android

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev python3-venv \
            libssl-dev libffi-dev zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake unzip

      - name: Install Buildozer
        run: pip3 install --upgrade buildozer cython virtualenv

      - name: Build APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: locker-apk
          path: bin/*.apk
